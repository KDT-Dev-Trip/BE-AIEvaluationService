apiVersion: v1
kind: Service
metadata:
  name: be-ai-evaluation-service
  namespace: be-ai-evaluation
  labels:
    app: be-ai-evaluation-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: be-ai-evaluation-service
---
apiVersion: v1
kind: Service
metadata:
  name: be-ai-evaluation-service-metrics
  namespace: be-ai-evaluation
  labels:
    app: be-ai-evaluation-service
    service: metrics
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: metrics
  selector:
    app: be-ai-evaluation-service