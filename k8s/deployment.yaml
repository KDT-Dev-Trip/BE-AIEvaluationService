apiVersion: apps/v1
kind: Deployment
metadata:
  name: be-ai-evaluation-service
  namespace: be-ai-evaluation
  labels:
    app: be-ai-evaluation-service
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: be-ai-evaluation-service
  template:
    metadata:
      labels:
        app: be-ai-evaluation-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: be-ai-evaluation-service
      imagePullSecrets:
        - name: docker-registry-secret
      containers:
      - name: be-ai-evaluation-service
        image: your-registry.com/be-ai-evaluation-service:latest  # This will be updated by Jenkins
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: be-ai-evaluation-secrets
              key: GEMINI_API_KEY
        - name: AWS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: be-ai-evaluation-secrets
              key: AWS_ACCESS_KEY
        - name: AWS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: be-ai-evaluation-secrets
              key: AWS_SECRET_KEY
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config-volume
        configMap:
          name: be-ai-evaluation-config
      securityContext:
        fsGroup: 1001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - be-ai-evaluation-service
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: be-ai-evaluation-service
  namespace: be-ai-evaluation
  labels:
    app: be-ai-evaluation-service
automountServiceAccountToken: false