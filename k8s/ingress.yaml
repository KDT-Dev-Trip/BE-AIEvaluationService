apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: be-ai-evaluation-service-ingress
  namespace: be-ai-evaluation
  labels:
    app: be-ai-evaluation-service
  annotations:
    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    
    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    
    # Certificate manager for TLS (optional)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ai-evaluation.yourdomain.com  # Replace with your domain
    secretName: be-ai-evaluation-tls
  rules:
  - host: ai-evaluation.yourdomain.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: be-ai-evaluation-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: be-ai-evaluation-service
            port:
              number: 80
      - path: /swagger-ui
        pathType: Prefix
        backend:
          service:
            name: be-ai-evaluation-service
            port:
              number: 80
      - path: /api-docs
        pathType: Prefix
        backend:
          service:
            name: be-ai-evaluation-service
            port:
              number: 80
---
# Alternative Ingress without TLS for testing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: be-ai-evaluation-service-ingress-http
  namespace: be-ai-evaluation
  labels:
    app: be-ai-evaluation-service
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
  - host: ai-evaluation-http.yourdomain.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: be-ai-evaluation-service
            port:
              number: 80