apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: be-ai-evaluation-service-staging
  namespace: argocd
  labels:
    app: be-ai-evaluation-service
    environment: staging
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/k8s-manifests.git  # Replace with your manifests repo
    targetRevision: HEAD
    path: be-ai-evaluation-service/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: be-ai-evaluation-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
  - group: ""
    kind: Service
    jsonPointers:
    - /spec/clusterIP