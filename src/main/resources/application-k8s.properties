spring.application.name=BE-AI-evaluation-service

# Active profiles (development default for now)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:k8s}

# Server Configuration
server.port=8084

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:test-key-for-development}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent

# Database Configuration - Kubernetes MySQL Service
spring.datasource.url=jdbc:mysql://mysql-service:3306/devtrip-ai-evaluation?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1111}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.connection.pool_size=10
spring.jpa.properties.hibernate.connection.autocommit=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.filter=false
springdoc.show-actuator=false

# Kafka Configuration - Kubernetes Kafka Service
spring.kafka.bootstrap-servers=kafka-service:9092
spring.kafka.consumer.group-id=ai-evaluation-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Topics
kafka.topic.mission-completed=mission.completed
kafka.topic.mission-temp-save=mission.temp.save
kafka.topic.evaluation-completed=evaluation.completed

# 표준화된 카프카 토픽 설정
kafka.topics.auth-events=auth-events
kafka.topics.user-events=user-events
kafka.topics.mission-events=mission-events
kafka.topics.payment-events=payment-events
kafka.topics.evaluation-events=evaluation-events
kafka.topics.mission-completed=mission-completed
kafka.topics.mission-temp-save=mission-temp-save
kafka.topics.evaluation-retry=evaluation-retry

# Redis Configuration - Kubernetes Redis Service
spring.redis.enabled=true
spring.redis.host=redis-service
spring.redis.port=6379
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=2
spring.redis.database=0

# AWS S3 Configuration - Enabled by default (!dev)
aws.s3.enabled=true
aws.s3.region=ap-northeast-2
aws.s3.access-key=${AWS_ACCESS_KEY}
aws.s3.secret-key=${AWS_SECRET_KEY}

# Actuator & Monitoring (표준 설정)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.security.enabled=false
management.endpoint.info.enabled=true
management.metrics.export.prometheus.enabled=true
management.health.defaults.enabled=true
management.health.diskspace.enabled=true
management.health.db.enabled=true
management.health.kafka.enabled=false
management.health.redis.enabled=false

# Application Info
info.app.name=${spring.application.name}
info.app.version=@project.version@
info.app.description=DevTrip AI Evaluation Service - Mission Assessment

# Gemini API Retry and Timeout Configuration
gemini.api.retry.max-attempts=3
gemini.api.retry.delay-seconds=2
gemini.api.timeout.connect-seconds=30
gemini.api.timeout.read-seconds=120

spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0

# Disable default Spring Security if accidentally included
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Logging Configuration for debugging
logging.level.ac.su.kdt.beaievaluationservice.service.GeminiEvaluationService=DEBUG

# External Service URLs - Kubernetes Services
external.services.mission.url=http://mission-management-service:8083
external.services.user.url=http://user-management-service:8082