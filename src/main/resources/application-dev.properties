# Development Profile Configuration
spring.application.name=BE-AI-evaluation-service

# Server Configuration
server.port=8084

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:test-key-for-development}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent

# Database Configuration - Support both H2 and MySQL for development
# Use H2 by default, switch to MySQL by setting SPRING_PROFILES_ACTIVE=dev,mysql
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# MySQL Development Configuration (activated with mysql profile)
# mysql.datasource.url=jdbc:mysql://localhost:3306/ai_evaluation_dev_db?useSSL=false&serverTimezone=Asia/Seoul
# mysql.datasource.username=ai_eval_dev
# mysql.datasource.password=dev_password
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.connection.pool_size=10
spring.jpa.properties.hibernate.connection.autocommit=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.filter=false
springdoc.show-actuator=false

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ai-evaluation-group-dev
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka Topics
kafka.topic.mission-completed=mission.completed.dev
kafka.topic.mission-temp-save=mission.temp.save.dev
kafka.topic.evaluation-completed=evaluation.completed.dev

# S3 Configuration - Disabled in dev profile (!dev means enabled everywhere else)
aws.s3.enabled=false
aws.s3.region=ap-northeast-2
aws.s3.access-key=mock-access-key-for-dev
aws.s3.secret-key=mock-secret-key-for-dev

management.endpoints.web.exposure.include=*

# Gemini API Retry and Timeout Configuration
gemini.api.retry.max-attempts=3
gemini.api.retry.delay-seconds=2
gemini.api.timeout.connect-seconds=30
gemini.api.timeout.read-seconds=120

spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0